[project]
name = "aira-api"
version = "0.1.0"
description = "AIRA — multi-tenant AI analyst for small retail shops"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pgvector==0.5.0",
    "python-dotenv==1.2.3",
    "python-dateutil==2.9.0.post0",
    "tzdata==2026.4",  # IANA zones on Windows; ZoneInfo has no system db there
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "pyyaml==6.0.3",
    "anthropic==1.8.0",
    "voyageai==0.5.0",
    "pypdf==6.19.0",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20250915",
]
local = [
    "fastembed==0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# Typography we write on purpose: en dashes in ranges an owner reads ("11-1",
# "04 Mar - 10 Mar") and the curly quotes the PDF writer maps back to ASCII.
# The homoglyphs worth catching - Cyrillic lookalikes in identifiers - are not
# on this list.
allowed-confusables = ["–", "‘", "’"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are declarations, not mutable defaults. Ruff lets
# them past only when the parameter's annotation is on its own immutable list,
# which leaves `uuid.UUID` query params looking like the real B008 bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: talks to a source system and re-syncs; minutes, not seconds",
]
