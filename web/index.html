<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AIRA — the shop's analyst, whatever the shop runs on." />
    <title>AIRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Before first paint, or the page flashes light and then repaints dark.
      // Mirrors lib/theme.ts: stored choice wins, default is light, and only
      // "system" consults the machine.
      (function () {
        var choice = 'light'
        try {
          var raw = localStorage.getItem('aira-theme')
          if (raw === 'light' || raw === 'dark' || raw === 'system') choice = raw
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
