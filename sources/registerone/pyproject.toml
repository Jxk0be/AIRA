[project]
name = "registerone"
version = "0.1.0"
description = "A fictional cloud POS, used to test AIRA's adapters against something that behaves like the real thing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "psycopg[binary,pool]==3.2.12",
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registerone"]

[tool.ruff]
# Wider than the app's 100: this project is mostly inline SQL, and wrapping
# those strings to 100 makes them harder to read, not easier.
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Query/Header defaults are the documented way to declare parameters.
"registerone/api.py" = ["B008"]
