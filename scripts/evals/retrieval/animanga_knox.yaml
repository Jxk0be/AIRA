# Retrieval golden set — Animanga Knox
#
# Twenty questions a shop owner or a member of staff would actually type, and
# what a good answer has to contain. A query counts as a hit when any expected
# string appears in the title of one of the top k results, matched without
# regard to case.
#
# The mix is deliberate. Some questions only an embedding can answer ("cosy
# fantasy manga about cooking" never says "Delicious in Dungeon"), some only
# full-text can ("Toploaders"), and some need the uploaded documents rather than
# the catalogue at all. That spread is the whole point: it is what makes the
# hybrid-versus-single-strategy comparison mean something.

- query: manga about a demon hunter and his sister
  expect: [Demon Slayer]
  note: semantic — the shelf label never says "sister"

- query: cosy fantasy manga about cooking
  expect: [Delicious in Dungeon]
  note: semantic — nothing in the text says cooking

- query: manga about an elf outliving her party
  expect: [Frieren]

- query: Prismatic Evolutions elite trainer box
  expect: [Prismatic Evolutions Elite Trainer Box]

- query: One Piece starter deck
  expect: [One Piece Card Game, Starter Deck]

- query: card sleeves
  expect: [Matte Sleeves, Perfect Fit Sleeves]

- query: Toploaders
  expect: [Toploaders]
  note: exact term, the kind of thing embeddings blur and full-text nails

- query: 9-pocket binder for my collection
  expect: [9-Pocket Exo-Tec Binder]

- query: deck case that holds a hundred cards
  expect: [Deck Case 100+]

- query: playmat
  expect: [Playmat]

- query: chainsaw dog plush
  expect: [Pochita Plush]
  note: semantic — the label says Pochita, not dog

- query: 1/7 scale figure of Frieren
  expect: [1/7 Scale - Frieren]

- query: master grade gundam kit
  expect: [MG 1/100]

- query: gojo t-shirt or hoodie
  expect: [Jujutsu Kaisen Sukuna Hoodie, Jujutsu Kaisen Gojo Poster]

- query: melon soda
  expect: [Ramune Soda - Melon, Fanta Melon Soda]

- query: matcha pocky
  expect: [Pocky - Matcha]

- query: enamel pin
  expect: [Enamel Pin]

- query: wall scroll for behind the register
  expect: [Wall Scroll]

- query: can I return a figure I opened at home
  expect: [Returns and exchanges]
  note: document, not catalogue

- query: how much do you pay for single cards
  expect: [Frequently asked questions]

- query: when is the Friday tournament
  expect: [Events and conventions, Frequently asked questions]

- query: is there parking nearby
  expect: [Frequently asked questions]
