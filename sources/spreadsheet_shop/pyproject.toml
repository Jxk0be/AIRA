[project]
name = "panelpawn"
version = "0.1.0"
description = "Panel & Pawn — a fake shop whose entire system is a messy Excel export"
requires-python = ">=3.12,<3.13"
dependencies = ["openpyxl==3.1.5"]

[dependency-groups]
dev = ["ruff==0.16.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panelpawn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
