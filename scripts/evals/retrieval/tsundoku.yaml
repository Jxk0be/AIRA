# Retrieval golden set — Tsundoku & Tabletop
#
# Twenty questions a shop owner or a member of staff would actually type, and
# what a good answer has to contain. A query counts as a hit when any expected
# string appears in the title of one of the top k results, matched without
# regard to case.
#
# The mix is deliberate. Some questions only an embedding can answer ("cosy
# manga about a coffee shop" never says "Ronin Barista"), some only full-text
# can ("Toploaders"), and some need the uploaded documents rather than the
# catalogue at all. That spread is the whole point: it is what makes the
# hybrid-versus-single-strategy comparison mean something.

- query: manga about a samurai at sea
  expect: [Saltwater Samurai]
  note: semantic — the shelf label never says "at sea"

- query: cosy manga set in a coffee shop
  expect: [Ronin Barista]
  note: semantic — nothing in the text says coffee shop

- query: a story about a vending machine
  expect: [Starlit Vending Machine, Vending Ghost]

- query: Veil of Nine booster box
  expect: [Veil of Nine Booster Box]

- query: Ember Accord starter deck
  expect: [Ember Accord Starter Deck]

- query: card sleeves
  expect: [Card Sleeves, Perfect Fit Sleeves]

- query: Toploaders
  expect: [Toploaders]
  note: exact term, the kind of thing embeddings blur and full-text nails

- query: 9-pocket binder for my collection
  expect: [9-Pocket Binder]

- query: magnetic deck box
  expect: [Deck Box]

- query: playmat
  expect: [Playmat]

- query: plush fox
  expect: [Mochi the Fox Plush]

- query: 1/7 scale figure of Yuzuha
  expect: [Yuzuha 1/7 Scale Figure]

- query: master grade model kit
  expect: [Master Grade Model Kit]

- query: t-shirt with the lantern design
  expect: [Hollow Lantern Crest Tee]

- query: apron
  expect: [Ronin Barista Apron]

- query: can I return a figure I opened at home
  expect: [Returns and exchanges]
  note: document, not catalogue

- query: how much do you pay for single cards
  expect: [Frequently asked questions]

- query: when is the Friday tournament
  expect: [Events and conventions, Frequently asked questions]

- query: what time do you close on Sunday
  expect: [Frequently asked questions]

- query: is there parking nearby
  expect: [Frequently asked questions]
